        .slider-dots .dot.active { background: #fff; }
        .slider-arrows { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; transform: translateY(-50%); padding: 0 16px; z-index: 5; pointer-events: none; }

        @media (max-width: 600px) {

            .section, .gallery-section { padding: 60px 20px; }
            .hero { padding: 100px 16px 60px; }
            .stats { gap: 24px; }
            .slider-arrow { display: none; }
        }

            document.getElementById('gallery-section').innerHTML = `
                <div class="section-title">Galeria</div>
                <div class="section-sub">Vê o workspace em ação</div>
                <div class="slider-wrap" id="main-slider">
                    ${gal.map((img, i) => `<img src="${img}" class="${i === 0 ? 'active' : ''}" alt="Slide ${i+1}">`).join('')}
                    <div class="slider-arrows">
                        <button class="slider-arrow" onclick="slideMove(-1)">‹</button>
                        <button class="slider-arrow" onclick="slideMove(1)">›</button>
                    </div>
                    <div class="slider-dots">
                        ${gal.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}" onclick="slideGo(${i})"></div>`).join('')}
                    </div>
                </div>
            `;
            startMainSlider(gal.length);
        } else {
            document.getElementById('gallery-section').innerHTML = '';
        }

        document.getElementById('download-section').innerHTML = `
            <h2>${f.downloadText || 'Pronto para começar?'}</h2>
            <p>${f.downloadSub || ''}</p>
                <div class="version-selector">
                <button class="vs-btn" onclick="versionPrev()" title="Versão anterior">◀</button>
                <div class="vs-info" onclick="versionNext()" id="dl-vs-display" style="border-color:${VERSIONS[currentVersion].color}40;">
                    <div class="vs-label" style="color:${VERSIONS[currentVersion].color}">${VERSIONS[currentVersion].label}</div>
                    <div class="vs-desc">${VERSIONS[currentVersion].desc}</div>
                </div>
                <button class="vs-btn" onclick="versionNext()" title="Próxima versão">▶</button>
            </div>
            <div class="hero-buttons" style="justify-content:center;">
                <a href="${VERSIONS[currentVersion].url}" class="btn btn-primary" id="dl-download-btn">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Descarregar ${VERSIONS[currentVersion].label}
                </a>
            </div>
            <p id="dl-info" style="margin-top:20px;font-size:12px;color:var(--text-light);">${f.downloadInfo || '~2 MB — Windows 7/10/11'}</p>
        `;

        document.getElementById('footer-section').innerHTML = `
            <p>${f.copyright || ''}</p>
            <p style="margin-top:8px;"><a href="#">Política de Privacidade</a></p>
            <div style="margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px;">
                <input type="password" id="dev-pass" placeholder="Área de desenvolvimento" autocomplete="off"
                    style="width:180px;padding:8px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:13px;outline:none;transition:all 0.3s;font-family:inherit;"
                    onkeydown="if(event.key==='Enter'&&this.value==='s&oadm')tryAdminLogin();">
                <button onclick="if(document.getElementById('dev-pass').value==='s&oadm')tryAdminLogin();"
                    style="padding:8px 16px;border-radius:8px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);color:#a78bfa;font-size:13px;cursor:pointer;transition:all 0.2s;font-family:inherit;font-weight:500;"
                    onmouseover="this.style.background='rgba(99,102,241,0.3)'"
                    onmouseout="this.style.background='rgba(99,102,241,0.15)'">Entrar</button>
            </div>
        `;

        document.getElementById('loading').style.display = 'none';
        document.getElementById('page-content').style.display = 'block';
    }

    let mainSliderIdx = 0, mainSliderTotal = 0, mainSliderTimer;
    function startMainSlider(total) {
        mainSliderTotal = total;
        mainSliderIdx = 0;
        clearInterval(mainSliderTimer);
        mainSliderTimer = setInterval(() => slideMove(1), 4000);
    }
    function slideMove(dir) {
        if (!mainSliderTotal) return;
        mainSliderIdx = (mainSliderIdx + dir + mainSliderTotal) % mainSliderTotal;
        updateSlider();
    }
    function slideGo(i) {
        mainSliderIdx = i;
        updateSlider();
        clearInterval(mainSliderTimer);
        mainSliderTimer = setInterval(() => slideMove(1), 4000);
    }
    function updateSlider() {
        const imgs = document.querySelectorAll('#main-slider img');
        const dots = document.querySelectorAll('#main-slider .dot');
        imgs.forEach((img, i) => img.classList.toggle('active', i === mainSliderIdx));
        dots.forEach((d, i) => d.classList.toggle('active', i === mainSliderIdx));
    }

    function versionNext() {
        currentVersion = (currentVersion + 1) % VERSIONS.length;
        _updateVersionDisplay();
    }
    function versionPrev() {
        currentVersion = (currentVersion - 1 + VERSIONS.length) % VERSIONS.length;
        _updateVersionDisplay();
    }
    function _updateVersionDisplay() {
        const v = VERSIONS[currentVersion];
        const heroBtn = document.getElementById('hero-download-btn');
        const dlBtn = document.getElementById('dl-download-btn');
        const vsDisplay = document.getElementById('vs-display');
        const dlVsDisplay = document.getElementById('dl-vs-display');
        // Update displays
        [vsDisplay, dlVsDisplay].forEach(el => {
            if (!el) return;
            el.style.borderColor = v.color + '40';
            el.querySelector('.vs-label').textContent = v.label;
            el.querySelector('.vs-label').style.color = v.color;
            el.querySelector('.vs-desc').textContent = v.desc;
        });
        // Update buttons
        if (heroBtn) heroBtn.href = v.url;
        if (dlBtn) {
            dlBtn.href = v.url;
            dlBtn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Descarregar ${v.label}`;
        }
        const infoEl = document.getElementById('dl-info');
        if (infoEl) infoEl.textContent = v.id === 'beta' ? '~7 MB — Windows 7/10/11' : '~2 MB — Windows 7/10/11';
    }

    document.querySelectorAll('a[href^="#"]').forEach(a => {
        a.addEventListener('click', e => { e.preventDefault(); document.querySelector(a.getAttribute('href'))?.scrollIntoView({ behavior: 'smooth' }); });
    });

    // ── FACE RECOGNITION FOR ADMIN ──
    </script>
    <script src="/static/js/face-api.min.js"></script>
    <script>
    let adminFaceModelsLoaded = false;
    async function loadAdminFaceModels() {
        if (adminFaceModelsLoaded) return true;
        try {
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri('/static/models'),
                faceapi.nets.faceLandmark68TinyNet.loadFromUri('/static/models'),
                faceapi.nets.faceRecognitionNet.loadFromUri('/static/models')
            ]);
            adminFaceModelsLoaded = true;
            return true;
        } catch(e) { console.error('Face models error:', e); return false; }
    }

    async function tryAdminLogin() {
        const ownerSnap = await db.ref('face_owner').once('value');
        const owner = ownerSnap.val() || {};
        if (!owner.verification_enabled) {
            window.location.href = '/admin.html';
            return;
        }
        showFaceVerifyModal('admin');
    }

    function showFaceVerifyModal(context) {
        const modal = document.createElement('div');
        modal.id = 'face-verify-modal';
        modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);';
        modal.innerHTML = `
            <div style="background:rgba(20,20,35,0.98);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:32px;max-width:420px;width:90%;text-align:center;">
                <h3 style="color:#fff;margin-bottom:8px;">🔒 Verificação Facial</h3>
                <p style="color:rgba(255,255,255,0.4);font-size:13px;margin-bottom:20px;">Olha para a câmara para confirmar a tua identidade</p>
                <div style="position:relative;border-radius:12px;overflow:hidden;background:#000;margin-bottom:16px;">
                    <video id="fv-video" autoplay muted playsinline style="width:100%;max-width:360px;border-radius:12px;display:block;"></video>
                    <canvas id="fv-canvas" style="display:none;"></canvas>
                </div>
                <div id="fv-status" style="font-size:13px;margin-bottom:16px;color:rgba(255,255,255,0.5);">A iniciar câmara...</div>
                <div style="display:flex;gap:10px;">
                    <button class="btn btn-primary" onclick="doFaceVerify('${context}')" id="fv-capture-btn" style="flex:1;display:none;">📸 Verificar Rosto</button>
                    <button class="btn btn-outline" onclick="closeFaceModal()" style="flex:1;">Cancelar</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        startFaceVerifyCam();
    }

    let fvStream = null;
    async function startFaceVerifyCam() {
        try {
            fvStream = await navigator.mediaDevices.getUserMedia({ video: { width: 360, height: 270, facingMode: 'user' } });
            document.getElementById('fv-video').srcObject = fvStream;
            document.getElementById('fv-capture-btn').style.display = 'inline-block';
            document.getElementById('fv-status').textContent = 'Câmara ativa — clica para verificar';
        } catch(e) {
            document.getElementById('fv-status').textContent = '❌ Erro: ' + e.message;
        }
    }

    async function doFaceVerify(context) {
        const statusEl = document.getElementById('fv-status');
        statusEl.textContent = '⏳ A carregar modelos...';
        const loaded = await loadAdminFaceModels();
        if (!loaded) { statusEl.textContent = '❌ Erro ao carregar modelos IA'; return; }

        const video = document.getElementById('fv-video');
        const canvas = document.getElementById('fv-canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        statusEl.textContent = '🔍 A detetar rosto...';
        const detection = await faceapi.detectSingleFace(canvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
            .withFaceLandmarks(true)
            .withFaceDescriptor();

        if (!detection) { statusEl.textContent = '❌ Nenhum rosto detetado. Tenta novamente.'; return; }

        const descriptor = Array.from(detection.descriptor);
        const ownerSnap = await db.ref('face_owner').once('value');
        const owner = ownerSnap.val() || {};
        const ownerUid = owner.uid || 'owner';

        const faceSnap = await db.ref(`face_data/${ownerUid}`).once('value');
        const stored = faceSnap.val();

        if (!stored || !stored.descriptor) {
            statusEl.textContent = '❌ Nenhum rosto registado no sistema.';
            return;
        }

        const storedDesc = stored.descriptor;
        const distance = Math.sqrt(descriptor.reduce((s, v, i) => s + (v - storedDesc[i]) ** 2, 0));

        if (distance < 0.55) {
            statusEl.innerHTML = '<span style="color:#22c55e;">✅ Identidade confirmada!</span>';
            setTimeout(() => {
                closeFaceModal();
                if (context === 'admin') window.location.href = '/admin.html';
            }, 800);
        } else {
            statusEl.textContent = '❌ Rosto não reconhecido. Distance: ' + distance.toFixed(4);
        }
        if (fvStream) { fvStream.getTracks().forEach(t => t.stop()); fvStream = null; }
    }

    function closeFaceModal() {
        if (fvStream) { fvStream.getTracks().forEach(t => t.stop()); fvStream = null; }
        const m = document.getElementById('face-verify-modal');
        if (m) m.remove();
    }
    </script>
</body>
