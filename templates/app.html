<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&O+ Ultra Workspace</title>
    <meta name="google-site-verification" content="QQq-ndcDBhil7D9BwtY_oZjKKrxIKOHU0TResT4KE14" />
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/app.css?v=3.4">
    <link rel="manifest" href="/manifest.json">
    <script src="/static/js/firebase-app-compat.js"></script>
    <script src="/static/js/firebase-auth-compat.js"></script>
    <script src="/static/js/firebase-database-compat.js"></script>
    <script src="/static/js/firebase-storage-compat.js"></script>
    <script src="https://meet.jit.si/external_api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="loading-screen">
        <div class="loader-orb"></div>
        <div class="loader-text">S&O+<span>Ultra</span></div>
    </div>

    <div id="app" style="display:none;">
        <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-logo"><h1>S&O+</h1><small>Ultra Workspace</small></div>
            <div class="sidebar-nav" id="nav-container"></div>
            <div class="sidebar-footer">
                <div class="user-pill" id="user-pill">
                    <div class="user-avatar" id="user-avatar">?</div>
                    <div class="user-info">
                        <div class="user-name" id="user-name">...</div>
                        <div class="user-role" id="user-role">...</div>
                    </div>
                </div>
            </div>
        </nav>
        <div class="main-content" id="mainContent">
            <div class="topbar">
                <button class="hamburger" id="hamburger" onclick="toggleSidebar()">☰</button>
                <span class="topbar-title" id="page-title">Dashboard</span>
                <div class="topbar-actions" id="topbar-actions"></div>
            </div>
            <div class="scroll-area" id="content-area"></div>
            <div class="content-resize" id="contentResize"></div>
        </div>
    </div>

    <!-- AI FAB -->
    <div id="ai-fab" onclick="toggleAI()">✨</div>
    <div id="ai-panel">
        <div class="ai-header"><span>🤖 IA S&O+ Ultra</span><span class="ai-close" onclick="toggleAI()">✖</span></div>
        <div class="ai-messages" id="ai-chat">
            <div class="ai-msg">Olá! Sou o assistente IA do S&O+. Pergunta-me qualquer coisa!</div>
        </div>
        <div class="ai-input-wrap">
            <input type="text" class="form-input" id="ai-in" placeholder="Escreve..." onkeypress="if(event.key==='Enter')askAI()" style="flex:1;">
            <button class="btn btn-ai" onclick="askAI()">Ir</button>
        </div>
    </div>

    <div class="confetti-container" id="confettiContainer"></div>
    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-ring" id="cursorRing"></div>
    <div class="cursor-glow-trail" id="cursorGlow"></div>
    <canvas id="particleCanvas"></canvas>

    <script src="/static/js/firebase-config.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script>
    db.ref('site_content/design').on('value', snap => {
        const d = snap.val();
        if (!d) return;
        if (d.favicon) {
            let link = document.querySelector("link[rel~='icon']");
            if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
            link.href = d.favicon;
            link.type = 'image/png';
        }
        if (d.logo) {
            const sb = document.querySelector('.sidebar-logo');
            if (sb) sb.innerHTML = '<img src="' + d.logo + '" alt="Logo" style="height:36px;width:auto;"><small>Ultra Workspace</small>';
            const ld = document.querySelector('.loader-text');
            if (ld) ld.innerHTML = '<img src="' + d.logo + '" alt="Logo" style="height:48px;width:auto;"><span>Ultra</span>';
        }
        if (d.accentColor) {
            document.documentElement.style.setProperty('--primary', d.accentColor);
            const r = parseInt(d.accentColor.slice(1,3),16), g = parseInt(d.accentColor.slice(3,5),16), b = parseInt(d.accentColor.slice(5,7),16);
            document.documentElement.style.setProperty('--primary-rgb', r+','+g+','+b);
        }
    });
    // FCM messaging setup
    if ('serviceWorker' in navigator && 'Notification' in window) {
        Notification.requestPermission().then(perm => {
            if (perm === 'granted') {
                navigator.serviceWorker.register('/firebase-messaging-sw.js').then(reg => {
                    console.log('[FCM] Service worker registered');
                }).catch(err => {
                    console.warn('[FCM] SW registration failed:', err);
                });
            }
        });
    }
    // Check for version updates
    function checkVersionUpdate() {
        db.ref('version_notification').once('value', snap => {
            const v = snap.val();
            if (v && v.version) {
                const lastVer = localStorage.getItem('soplus_version_seen');
                if (lastVer !== v.version) {
                    setTimeout(() => {
                        const modal = document.createElement('div');
                        modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.8);';
                        modal.innerHTML = `
                            <div style="background:linear-gradient(135deg,#1e1b4b,#312e81);border:2px solid #a78bfa;border-radius:20px;padding:40px;max-width:480px;width:90%;text-align:center;">
                                <div style="font-size:48px;margin-bottom:12px;">🚀</div>
                                <h2 style="color:#fff;font-size:22px;margin-bottom:8px;">${v.title || 'Nova atualização!'}</h2>
                                <p style="color:var(--text-light);margin-bottom:20px;">${v.body || `Versão ${v.version} disponível.`}</p>
                                <button onclick="this.closest('[style]').remove();localStorage.setItem('soplus_version_seen','${v.version}')" 
                                    style="padding:12px 32px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;">
                                    ✅ OK
                                </button>
                            </div>`;
                        document.body.appendChild(modal);
                    }, 5000);
                }
            }
        });
    }
    setTimeout(checkVersionUpdate, 3000);
    </script>
    <script src="/static/js/app.js?v=3.4"></script>
    <!-- Enhanced extensions (override inline versions) -->
    <script src="/static/js/extensions/word.js?v=3.4"></script>
    <script src="/static/js/extensions/excel.js?v=3.4"></script>
    <script src="/static/js/extensions/powerpoint.js?v=3.4"></script>
    <script src="/static/js/extensions/desenho.js?v=3.4"></script>
    <script src="/static/js/extensions/chat.js?v=3.4"></script>
    <script src="/static/js/extensions/configuracoes.js?v=3.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/vs/loader.js"></script>
</body>
</html>
